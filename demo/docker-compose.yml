version: '3.8'

services:
  source-db:
    image: mysql:8.0
    container_name: dbseal-demo-source
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop_prod
    ports:
      - "33061:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  staging-db:
    image: mysql:8.0
    container_name: dbseal-demo-staging
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop_dev
    ports:
      - "33062:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
